name: Monthly CelesTrak Data Auto-Update

on:
  schedule:
    - cron: '0 0 1 * *' # 1st day of every month at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest CelesTrak orbital & SATCAT data
        run: python scripts/fetch-data.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): automated monthly CelesTrak data update"
            git push origin main
          fi
